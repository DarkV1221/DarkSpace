name: Build DarkSpace JAR

on:
  push:
    branches:
      - feature/planetary-portal-gun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod JAR
        run: gradle build
      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: DarkSpace-portal-gun-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
